# Kotlin
kotlin.code.style=official
# 编译守护进程：加大堆并使用并行 GC（编译吞吐优先）
kotlin.daemon.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC

# Kotlin 增量编译（KGP 已改用 ABI snapshot，旧 classpath snapshot 开关已废弃）
kotlin.incremental=true

# KSP 增量与跨模块增量（Room/Koin 符号处理提速）
ksp.incremental=true
ksp.incremental.intermodule=true

# Gradle
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
kotlin.native.ignoreDisabledTargets=true

# Android
android.nonTransitiveRClass=true
android.useAndroidX=true
